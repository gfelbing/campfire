# Campfire Helm values. Everything the chart touches is configurable here.

# The Docker image to run. `tag` empty = the chart's appVersion.
image:
  repository: ghcr.io/gfelbing/campfire
  tag: ""
  pullPolicy: IfNotPresent

# The public DNS name of the deployment. Used for:
#  - the cert-manager Certificate's dnsName
#  - the TCP ingress route's SNI match (TLS passes through to the pod)
domain: example.com

# Public address advertised by the server (--external, an IP:port — the
# server requires a literal IP). Used by the Alt-Svc bootstrap to name the
# port clients can reach. Empty = omit the flag (fine when the port maps
# 1:1, e.g. tests).
# external: "1.2.3.4:443"
external: ""

namespace:
  # The chart creates and uses its own namespace by default. Set
  # `create: false` to deploy into the release namespace instead
  # (`helm install -n ...`).
  create: true
  name: campfire

replicaCount: 1  # single instance by design (in-memory state)

maps:
  # The server scans the maps directory (--maps-dir) recursively at startup;
  # every Tiled *.json/*.tmj file becomes a map, tilesets are served from
  # files next to the map JSON. Two backings:
  #
  #  1. persistentVolume (default) — the chart creates a PVC and mounts it.
  #  2. hostPath — a node-local directory (put map folders there yourself).
  #     The PVC is not created in that case; the pod must land on the node
  #     that has the directory (add nodeSelector via podLabels or similar).
  kind: persistentVolume  # or "hostPath"
  mountPath: /maps
  # persistentVolume settings:
  size: 1Gi
  accessModes:
  - ReadWriteOnce
  storageClass: ""        # empty = the cluster's default StorageClass
  # hostPath settings:
  hostPath:
    path: /srv/campfire/maps
    type: Directory       # "" = unspecified; also DirectoryOrCreate

certificate:
  # Two ways to get TLS material into the pod (the secret is mounted
  # read-only at /certs AND the server serves TLS itself — Traefik must not
  # offload it, so the cert has to live in the pod either way):
  #
  #  1. create: true — chart creates a cert-manager.io/v1 Certificate.
  #  2. create: false — point secretName at an existing kubernetes.io/tls
  #     secret, e.g. a wildcard cert you already requested:
  #       certificate:
  #         create: false
  #         secretName: wildcard-example-com-tls
  #     (`kubectl create secret tls ... --cert=... --key=...` or any
  #      cert-manager Certificate you manage yourself).
  create: true
  secretName: campfire-tls
  issuerRef:  # only used when create: true
    name: cloudflare
    kind: ClusterIssuer  # or "Issuer"

traefik:
  tcp:
    # Traefik TCP entrypoint listening on 443/tcp. TLS stays end-to-end:
    # the route uses tls.passthrough, so Traefik forwards the ClientHello
    # untouched and the pod terminates TLS (QUIC/WebTransport need this).
    entrypoint: websecure
  udp:
    # Traefik UDP entrypoint listening on 443/udp (QUIC/HTTP/3).
    entrypoint: quic

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Optional extra args passed to the campfire binary verbatim.
extraArgs: []

# OpenID Connect authentication (README §11, authorization-code flow for a
# confidential client). When enabled, a visitor must sign in through the
# configured IdP before joining a room; the display name is forced from the
# IdP's id_token (a client can no longer choose its own). The redirect URI is
# derived from `domain` as `https://<domain>/auth/callback` — it must be
# registered with the IdP exactly.
auth:
  openid:
    enabled: false
    client:
      # The issuer (the id_token's `iss`; discovery is fetched from
      # `<issuer>/.well-known/openid-configuration`).
      issuer: ""
      # The client id registered with the IdP.
      id: ""
      # The client secret. Prefer `secretRef` (a Kubernetes Secret) over
      # putting the secret in values: values.yaml is usually in VCS. If both
      # are set, `secretRef` wins.
      secret: ""
      secretRef:
        # Name of a Kubernetes Secret holding the client secret. Empty = use
        # the inline `secret` above.
        name: ""
        # Key inside that Secret.
        key: client-secret
