{{/*
Single-instance deployment. Campfire keeps all state in memory (rooms,
presence), so one replica is the supported shape — see the scaling note
in docs/ops/README.md.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "campfire.fullname" . }}
  namespace: {{ include "campfire.namespace" . }}
  labels:
    {{- include "campfire.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate  # the QUIC/UDP socket cannot be shared during a rolling swap
  selector:
    matchLabels:
      {{- include "campfire.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "campfire.selectorLabels" . | nindent 8 }}
    spec:
      {{- if not (or (eq .Values.maps.kind "persistentVolume") (eq .Values.maps.kind "hostPath")) }}
      {{- fail (printf "maps.kind must be persistentVolume or hostPath, got %q" .Values.maps.kind) }}
      {{- end }}
      containers:
        - name: campfire
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --listen
            - "0.0.0.0:443"
            - --cert
            - /certs/tls.crt
            - --key
            - /certs/tls.key
            {{- if .Values.external }}
            - --external
            - {{ .Values.external | quote }}
            {{- end }}
            - --maps-dir
            - {{ .Values.maps.mountPath | quote }}
            {{- if .Values.auth.openid.enabled }}
            # OpenID Connect auth (docs/ops/README.md). The client secret arrives via
            # the env var below (never as an arg: args leak into logs and
            # `kubectl describe`).
            - --auth-openid-enabled
            - --auth-openid-issuer
            - {{ .Values.auth.openid.client.issuer | quote }}
            - --auth-openid-client-id
            - {{ .Values.auth.openid.client.id | quote }}
            - --auth-openid-redirect-uri
            - "https://{{ .Values.domain }}/auth/callback"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- if .Values.auth.openid.enabled }}
          env:
            - name: CAMPFIRE_AUTH_CLIENT_SECRET
              {{- if .Values.auth.openid.client.secretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.openid.client.secretRef.name }}
                  key: {{ .Values.auth.openid.client.secretRef.key | default "client-secret" }}
              {{- else }}
              value: {{ .Values.auth.openid.client.secret | quote }}
              {{- end }}
          {{- end }}
          ports:
            {{- /* one port number, both transports — see Dockerfile */}}
            - name: https
              containerPort: 443
              protocol: TCP
            - name: quic
              containerPort: 443
              protocol: UDP
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: maps
              mountPath: {{ .Values.maps.mountPath | quote }}
      volumes:
        - name: certs
          secret:
            secretName: {{ .Values.certificate.secretName }}
        {{- if eq .Values.maps.kind "hostPath" }}
        - name: maps
          hostPath:
            path: {{ .Values.maps.hostPath.path | quote }}
            type: {{ .Values.maps.hostPath.type | default "Directory" }}
        {{- else }}
        - name: maps
          persistentVolumeClaim:
            claimName: {{ include "campfire.fullname" . }}-maps
        {{- end }}
