[workspace]
resolver = "2"
members = [
    "crates/campfire-server",
    "crates/campfire-protocol",
    "crates/campfire-maps",
    "tools/loadtest",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.99.1"
license-file = "LICENSE"
repository = "https://github.com/campfire/campfire"

# Centralized dependency pins (README §10). Bump here, nowhere else.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
futures-util = "0.3"
h3 = "0.0"
h3-axum = { version = "0.3", features = ["webtransport"] }
h3-datagram = "0.0"
h3-quinn = "0.0"
h3-webtransport = "0.1"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
include_dir = "0.7"
jsonwebtoken = "9"
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-rustls = "0.26"
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
wtransport = { version = "0.7", features = ["quinn"] }

# MoQ SFU (crates/campfire-server). Pinned to the vendored copy in
# third_party/moq-net (see third_party/moq-net/PATCH.md for the local fix
# and how to re-vendor on a bump).
moq-net = "0.3.23"
moq-tokio = { version = "0.19.35", default-features = false }
web-transport-trait = "0.4"

# Internal crates
campfire-protocol = { path = "crates/campfire-protocol" }
campfire-maps = { path = "crates/campfire-maps" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Serve moq-net from the vendored, patched copy (third_party/moq-net/PATCH.md).
[patch.crates-io]
moq-net = { path = "third_party/moq-net" }
