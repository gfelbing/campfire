[workspace]
resolver = "2"
members = [
    "crates/campfire-server",
    "crates/campfire-protocol",
    "crates/campfire-maps",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/campfire/campfire"

# Centralized dependency pins (README §10). Bump here, nowhere else.
[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
futures-util = "0.3"
h3 = "0.0"
h3-axum = { version = "0.3", features = ["webtransport"] }
h3-quinn = "0.0"
h3-webtransport = "0.1"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
include_dir = "0.7"
quinn = "0.11"
rand = "0.8"
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turn-server = { version = "4.1", default-features = false, features = ["tcp", "ssl"] }
thiserror = "2"

# Internal crates
campfire-protocol = { path = "crates/campfire-protocol" }
campfire-maps = { path = "crates/campfire-maps" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
