<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Everything is same-origin (the server embeds the bundle).
         'unsafe-eval' is a PixiJS requirement (its shader compiler evals);
         the blob worker is Pixi's own inline code. The CSP still blocks
         remote scripts and objects. The inline style exception covers the
         UI's attribute styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>Campfire</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <nav class="sidebar-tabs">
          <button data-tab="menu" title="main menu">🏠</button>
          <button data-tab="players" title="players">👥</button>
          <button data-tab="chat" title="chat">💬</button>
          <button id="sidebar-collapse" title="collapse the sidebar">«</button>
        </nav>
        <div class="sidebar-panes">
          <div class="sidebar-pane" data-pane="menu" id="pane-menu"></div>
          <div class="sidebar-pane hidden" data-pane="players" id="pane-players"></div>
          <div class="sidebar-pane hidden" data-pane="chat" id="pane-chat"></div>
        </div>
      </aside>
      <div id="app"></div>
    </div>
    <div id="boot"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
