<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Everything is same-origin (the server embeds the bundle).
         'unsafe-eval' is a PixiJS requirement (its shader compiler evals);
         the blob worker is Pixi's own inline code. The CSP still blocks
         remote scripts and objects. `script-src blob:` is what the MoQ
         audio pipeline needs: @moq/publish feeds its AudioWorklet capture
         from a blob module, and worklet module loads are governed by
         script-src (worker-src covers only dedicated workers). The inline
         style exception covers the UI's attribute styles. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>Campfire</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="layout">
      <header id="topbar">
        <div class="topbar-left">
          <button id="burger" title="toggle the sidebar" aria-label="toggle the sidebar">☰</button>
          <span class="topbar-logo">🔥 Campfire</span>
          <div class="map-drop">
            <button id="map-btn" class="map-btn" title="switch map" aria-haspopup="true"></button>
            <div id="map-list" class="map-list hidden"></div>
          </div>
        </div>
        <div class="topbar-right">
          <button id="mic-btn" class="topbar-toggle" title="mute / unmute (🎤)">🎤</button>
          <button id="cam-btn" class="topbar-toggle" title="camera on / off (📷)">📷</button>
          <button id="screen-btn" class="topbar-toggle hidden" title="share the screen (🖥)">🖥</button>
          <div class="status-drop">
            <button id="status-btn" class="topbar-toggle" title="presence status" aria-haspopup="true">
              <span class="sdot online"></span>
            </button>
            <div id="status-menu" class="map-list status-menu hidden"></div>
          </div>
          <button id="profile-btn" class="profile-btn" title="profile" aria-haspopup="true">
            <span class="status-initial"></span>
            <span class="sdot online"></span>
          </button>
          <div id="profile-menu" class="profile-menu hidden"></div>
        </div>
      </header>
      <div id="main">
        <aside id="sidebar">
          <nav class="sidebar-rail">
            <button data-open="players" title="users">👥</button>
            <button data-open="chat" title="chat">💬</button>
            <button data-open="bubble" class="hidden" title="bubble chat">🗣</button>
          </nav>
          <div class="sidebar-panes">
            <section class="accordion" data-acc="players">
              <button class="accordion-header" data-toggle="players">
                <span class="acc-label">👥 Users</span>
                <span class="acc-count" id="users-count"></span>
                <span class="acc-caret">▾</span>
              </button>
              <div class="accordion-body" data-pane="players"></div>
            </section>
            <section class="accordion" data-acc="chat">
              <button class="accordion-header" data-toggle="chat">
                <span class="acc-label">💬 Chat</span>
                <span class="acc-dot" hidden></span>
                <span class="acc-caret">▾</span>
              </button>
              <div class="accordion-body" data-pane="chat"></div>
            </section>
            <section class="accordion hidden" data-acc="bubble">
              <button class="accordion-header" data-toggle="bubble">
                <span class="acc-label">🗣 Bubble chat</span>
                <span class="acc-dot" hidden></span>
                <span class="acc-caret">▾</span>
              </button>
              <div class="accordion-body" data-pane="bubble"></div>
            </section>
          </div>
        </aside>
        <div id="app"></div>
      </div>
    </div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
