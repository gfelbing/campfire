[package]
name = "campfire-server"
description = "Campfire: a virtual office. One binary, one port (443 UDP+TCP), HTTP/3 + WebTransport + MoQ."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "campfire"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
bytes.workspace = true
campfire-maps.workspace = true
campfire-protocol.workspace = true
clap.workspace = true
crc32fast.workspace = true
futures-util.workspace = true
h3.workspace = true
h3-axum.workspace = true
h3-datagram.workspace = true
h3-quinn.workspace = true
h3-webtransport.workspace = true
hmac.workspace = true
include_dir.workspace = true
jsonwebtoken.workspace = true
moq-net.workspace = true
moq-tokio.workspace = true
quinn.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-rustls.workspace = true
web-transport-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
http.workspace = true
# Key-pair generation for the auth unit tests (RSAPair; verification-only in
# production, but the test signs real tokens).
jsonwebtoken.workspace = true
rcgen.workspace = true
wtransport = { version = "0.7", features = ["dangerous-configuration", "quinn"] }
