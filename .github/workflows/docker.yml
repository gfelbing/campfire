# Build the Docker image and push it to GHCR when a version tag is pushed.
#
# Trigger: tags like `v1.2.3`. The image is tagged with the version (with and
# without the leading `v`) and `latest`.

name: docker

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # v1.2.3 → 1.2.3 (the tag without its v-prefix)
            type=semver,pattern={{version}}
            # v1.2.3 → 1.2 (the semver major.minor)
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Chart version and appVersion follow the tag (v1.2.3 → 1.2.3); the
      # appVersion doubles as the default image tag in values.yaml.
      - name: Package the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          helm package deploy/helm/campfire \
            --version "$version" --app-version "$version" --destination out

      - name: Push the chart to GHCR
        run: helm push out/*.tgz "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/helm"
