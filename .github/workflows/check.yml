# PR / main checks. Each job does nothing but set up its toolchain and run
# one `just` target — all logic lives in the justfile (`ci-rust`,
# `ci-client`, `ci-e2e`). The `docker` workflow only builds + pushes on
# version tags; this catches regressions before a tag.

name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just ci-rust

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just ci-client

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - run: just ci-e2e

      - name: server log (on failure)
        if: failure()
        run: cat server.log || true
